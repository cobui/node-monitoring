# ──────────────────────────────────────────────────────────────────────────────
# node-monitoring — example configuration
#
# Bootstrap (once at startup):
#
#   import { Monitoring, loadConfig } from "@cobui/node-monitoring";
#
#   const monitoring = new Monitoring();
#   monitoring.add(loadConfig("monitoring.config.yml"));
#   monitoring.start();
#
# Credentials and other secrets should never be committed to source control.
# Use ${VAR_NAME} placeholders! `loadConfig` resolves them from process.env at
# startup and throws immediately if a referenced variable is not set.
# ──────────────────────────────────────────────────────────────────────────────

# ── Primary application namespace ────────────────────────────────────────────
# Transporter version alternatives:
#
#   version: 1  (InfluxDB OSS 1.x — legacy)
#     host: influx-legacy.internal
#     port: 8086          # default
#     protocol: http      # default
#     database: app-metrics
#     retentionPolicy: 90d  # optional
#     username: "monitor"
#     password: "${INFLUX_V1_PASSWORD}"
#
#   version: 2  (InfluxDB OSS 2.x / Cloud)
#     host: influxdb.example.com
#     port: 8086          # default
#     protocol: https     # default
#     org: my-org
#     bucket: app-metrics
#     token: "${INFLUX_TOKEN}"
#
#   version: 3  (InfluxDB 3 Core — self-hosted OSS)
#     host: localhost
#     port: 8181          # no default — must be set explicitly for Core
#     protocol: http      # default; use https in production
#     database: app-metrics
#     token: "${INFLUX_TOKEN}"
#
#   version: 3  (InfluxDB Cloud Serverless)
#     host: eu-central-1-1.aws.cloud2.influxdata.com
#     protocol: https     # override the default http
#     # port omitted → Node uses 443 for https automatically
#     database: app-metrics
#     token: "${INFLUX_TOKEN}"
#
- namespace: app
  enabled: true

  # Tags merged into every aggregate emitted by this namespace.
  tags:
    env: production
    service: api-gateway

  transporter:
    type: influx
    version: 2
    # default: "influx". Namespaces sharing the same key share one
    # queue and rate limit. Use a different key per transporter when
    # you need independent queues (e.g. separate hosts or rate limits).
    key: influx
    host: influxdb.example.com
    port: 8086
    protocol: https
    org: my-org
    bucket: app-metrics
    token: "${INFLUX_TOKEN}"

    rateLimit: 20 # requests per second (default: 10)
    gzip: true # compress payloads (default: true)

    # Controls the InfluxDB measurement name:
    #   "uri"       : each metric URI becomes its own measurement (default).
    #   "namespace" : all metrics share one measurement named after the namespace;
    #                 the metric URI is kept as a "uri" tag for filtering.
    measurementStrategy: uri

    # When true, stamps a "namespace" tag on every data point written to InfluxDB.
    # Useful when using measurementStrategy: "uri" with multiple namespaces on one
    # transporter — lets you filter by namespace without it being the measurement name.
    # Has no effect with measurementStrategy: "namespace" (namespace is the measurement).
    # default: false
    includeNamespaceTag: false

    retry:
      retries: 3 # attempts after the initial send (default: 3)
      minTimeout: 1000 # ms before the first retry (default: 1000)
      maxTimeout: 30000 # upper bound on backoff delay (default: 30000)
      factor: 2 # exponential multiplier: 1s → 2s → 4s … capped at 30s (default: 2)

    queue:
      maxSize: 10000 # drop incoming items when the normal queue exceeds this (default: unlimited)
      lossInterval: 300000 # ms between loss-record flushes (default: 300000 — 5 min)
      batchSize: 500 # aggregates per HTTP write request (default: 500)

  metrics:
    - uri: http.requests
      type: counter
      interval: 10000 # collect every 10 s
      reset: true # clear the counter after each collection
      enabled: true

    - uri: http.latency
      type: histogram
      interval: 10000
      reset: true
      enabled: true
      # Exclude high-cardinality tags from the series cache key.
      exclude:
        - user_id

    - uri: http.errors
      type: counter
      interval: 10000
      reset: true
      enabled: true

    - uri: system.memory_mb
      type: gauge
      interval: 5000 # collect every 5 s
      reset: false # gauges represent a current value — never reset
      enabled: true

    - uri: system.cpu_pct
      type: gauge
      interval: 5000
      reset: false
      enabled: true

    - uri: db.query_latency
      type: histogram
      interval: 30000
      reset: true
      enabled: true
      cache:
        max: 200 # keep up to 200 distinct tag-value combinations

# ── Example: sharing a transporter across namespaces ─────────────────────────
# When two namespaces write to the same backend, define the full transporter
# config once (e.g. on "app" above) and reference it by key here.
# The referenced key must be defined before this entry in the array.
# - namespace: debug
#   transporter:
#     key: influx   # reuses the "app" queue — no duplicate config needed
